name: generate-skyline

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # aairom/github-contribution-city is a Go CLI, not a composite action.
      - name: Fetch generator
        run: git clone --depth 1 https://github.com/aairom/github-contribution-city.git "$RUNNER_TEMP/city"

      - name: Build generator
        working-directory: ${{ runner.temp }}/city
        run: go build -o "$RUNNER_TEMP/city/bin/city" cmd/city/main.go

      - name: Generate skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          "$RUNNER_TEMP/city/bin/city" \
            -user aarush323 \
            -weeks 53 \
            -height 14 \
            -theme github-dark \
            -format svg \
            -output dist/skyline.svg

      - name: Commit skyline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/skyline.svg
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update contribution skyline [skip ci]"
          git push
